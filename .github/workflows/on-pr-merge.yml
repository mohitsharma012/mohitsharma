name: Test action on PR merge

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master

jobs:
  test-on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use NEW_SECRET
        env:
          NEW_SECRET: ${{ secrets.NEW_SECRET }}
        run: |
          echo "PR #${{ github.event.pull_request.number }} merged into ${{ github.event.pull_request.base.ref }}"
          if [ -z "$NEW_SECRET" ]; then
            echo "NEW_SECRET is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "NEW_SECRET is available (length ${#NEW_SECRET})"
