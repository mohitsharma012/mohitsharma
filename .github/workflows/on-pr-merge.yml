name: Test action on PR merge

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master

jobs:
  test-on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check merge secret availability
        env:
          NEW_SECRET: ${{ secrets.NEW_SECRET || secrets.NEW_SCRET }}
        run: |
          echo "PR #${{ github.event.pull_request.number }} merged into ${{ github.event.pull_request.base.ref }}"
          if [ -z "$NEW_SECRET" ]; then
            echo "No merge secret configured (NEW_SECRET or NEW_SCRET). Skipping secret-dependent check."
          else
            echo "Merge secret is available (length ${#NEW_SECRET})"
          fi
