name: Test action on PR merge

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main
      - master

jobs:
  test-on-merge:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use NEW_SCRET
        env:
          NEW_SCRET: ${{ secrets.NEW_SCRET }}
        run: |
          echo "Workflow triggered by: ${{ github.event_name }}"
          if [ -z "$NEW_SCRET" ]; then
            echo "NEW_SCRET is missing from the Production environment."
            exit 1
          fi
          echo "NEW_SCRET is available (length ${#NEW_SCRET})"
