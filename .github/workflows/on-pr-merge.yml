name: Test action on PR merge

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master

jobs:
  test-on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use NEW_SCRET
        env:
          NEW_SCRET: ${{ secrets.NEW_SCRET }}
        run: |
          echo "PR #${{ github.event.pull_request.number }} merged into ${{ github.event.pull_request.base.ref }}"
          if [ -z "$NEW_SCRET" ]; then
            echo "NEW_SCRET is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "NEW_SCRET is available (length ${#NEW_SCRET})"
